<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本自動車交通（株）納金計算アプリ</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #2c3e50;
        }
        .container {
            display: flex;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            flex-wrap: wrap;
        }
        .panel {
            flex: 1;
            min-width: 320px;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h2 {
            font-size: 1.1rem;
            border-bottom: 2px solid #3498db;
            padding-bottom: 5px;
            margin-top: 0;
            color: #3498db;
        }
        .form-group {
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .form-group label {
            font-size: 0.9rem;
            font-weight: bold;
        }
        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .form-group input {
            width: 100px;
            padding: 6px;
            text-align: right;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }
        .form-group span.unit {
            font-size: 0.9rem;
            font-weight: bold;
            color: #555;
            width: 20px;
        }
        .question-box {
            background: #f9fbfd;
            border: 1px dashed #bce8f1;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        .question-box p {
            margin: 0 0 8px 0;
            font-weight: bold;
            font-size: 0.85rem;
            color: #31708f;
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            font-size: 0.95rem;
        }
        .result-row.highlight {
            font-weight: bold;
            background-color: #eaf2f8;
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
            border-bottom: none;
        }
        .result-row.total {
            font-weight: bold;
            background-color: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 4px;
            margin-top: 15px;
            font-size: 1.1rem;
            border-bottom: none;
        }
        .sub-inputs {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
        }
        .sub-input-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sub-input-item label {
            font-size: 0.85rem;
            font-weight: bold;
            color: #444;
        }
        .sub-input-wrapper {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .sub-inputs input {
            width: 100px;
            padding: 6px;
            text-align: right;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }
        .sub-inputs span.unit {
            font-size: 0.9rem;
            font-weight: bold;
            color: #555;
            width: 20px;
        }
        .question-input-wrapper {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 8px;
        }
        .question-input-wrapper label {
            font-size: 0.85rem;
            font-weight: bold;
            color: #444;
        }
        .question-input-wrapper input {
            width: 100px;
            padding: 6px;
            text-align: right;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }
        .question-input-wrapper span.unit {
            font-size: 0.9rem;
            font-weight: bold;
            color: #555;
        }
    </style>
</head>
<body>

    <h1>日本自動車交通（株）納金計算アプリ</h1>

    <div class="container">
        <div class="panel">
            <h2>1. 納金指示書（レシート）</h2>
            <div class="form-group"><label>通行料他合計:</label><div class="input-wrapper"><input type="tel" class="calc-input" id="l_tsuko" value="" oninput="calculate()"><span class="unit">円</span></div></div>
            <div class="form-group"><label>クレジット合計:</label><div class="input-wrapper"><input type="tel" class="calc-input" id="l_credit" value="" oninput="calculate()"><span class="unit">円</span></div></div>
            <div class="form-group"><label>デビット合計:</label><div class="input-wrapper"><input type="tel" class="calc-input" id="l_debit" value="" oninput="calculate()"><span class="unit">円</span></div></div>
            <div class="form-group"><label>メンバーズ合計:</label><div class="input-wrapper"><input type="tel" class="calc-input" id="l_members" value="" oninput="calculate()"><span class="unit">円</span></div></div>
            <div class="form-group"><label>iD合計:</label><div class="input-wrapper"><input type="tel" class="calc-input" id="l_id" value="" oninput="calculate()"><span class="unit">円</span></div></div>
            <div class="form-group"><label>QUICPay合計:</label><div class="input-wrapper"><input type="tel" class="calc-input" id="l_quicpay" value="" oninput="calculate()"><span class="unit">円</span></div></div>
            <div class="form-group"><label>銀聯合計:</label><div class="input-wrapper"><input type="tel" class="calc-input" id="l_ginren" value="" oninput="calculate()"><span class="unit">円</span></div></div>
            <div class="form-group"><label>交通系IC合計:</label><div class="input-wrapper"><input type="tel" class="calc-input" id="l_ic" value="" oninput="calculate()"><span class="unit">円</span></div></div>
            <div class="form-group"><label>QR/ネット決済合計:</label><div class="input-wrapper"><input type="tel" class="calc-input" id="l_qr" value="" oninput="calculate()"><span class="unit">円</span></div></div>
            <div class="form-group"><label>総営収:</label><div class="input-wrapper"><input type="tel" class="calc-input" id="l_sosho" value="" oninput="calculate()"><span class="unit">円</span></div></div>

            <h2 style="margin-top: 25px;">2. 追加の質問回答</h2>
            
            <div class="question-box">
                <p>Q1. 営業補償はありましたか？</p>
                <div>
                    <label><input type="radio" name="q_eisho" value="0" checked onchange="toggleEisho()"> いいえ</label>
                    <label style="margin-left: 10px;"><input type="radio" name="q_eisho" value="1" onchange="toggleEisho()"> はい</label>
                </div>
                <div id="wrap_eisho" class="question-input-wrapper" style="display:none;">
                    <input type="tel" class="calc-input" id="val_eisho" value="" oninput="calculate()"><span class="unit">円</span>
                </div>
            </div>

            <div class="question-box">
                <p>Q2. キャンセル等はありましたか？</p>
                <div>
                    <label><input type="radio" name="q_cancel" value="0" checked onchange="toggleCancel()"> いいえ</label>
                    <label style="margin-left: 10px;"><input type="radio" name="q_cancel" value="1" onchange="toggleCancel()"> はい</label>
                </div>
                <div id="wrap_cancel" class="question-input-wrapper" style="display:none;">
                    <input type="tel" class="calc-input" id="val_cancel" value="" oninput="calculate()"><span class="unit">円</span>
                </div>
            </div>

            <div class="question-box">
                <p>Q3. チケット、クーポン等を受け取りましたか？</p>
                <div>
                    <label><input type="radio" name="q_ticket" value="
